name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check prose spacing in maintained Markdown
        run: python -S scripts/check_docs_spacing.py
      - name: Rebuild the historical Worker assignment
        run: python -S examples/preparing-worker-package/prepare.py "$RUNNER_TEMP/assignment"
      - name: Replay the portable Worker decision
        run: python -S examples/replaying-worker-trace/replay.py
      - name: Install pinned developer tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint maintained Python
        run: poe lint
      - name: Verify the lint failure control
        run: |
          probe=$(mktemp examples/replaying-worker-trace/ci_probe_XXXXXX.py)
          trap 'rm -f "$probe"' EXIT
          echo 'import math' > "$probe"
          if poe lint > "$RUNNER_TEMP/lint-control" 2>&1; then exit 1; fi
          grep -F 'F401' "$RUNNER_TEMP/lint-control"
      - name: Check checkpoint policy types
        run: poe typecheck
      - name: Run portable Python tests and report coverage
        run: |
          poe coverage
          coverage json -o "$RUNNER_TEMP/coverage.json"
          jq -r '.totals | "Portable Python tests, scripts/ · statements \(.covered_lines)/\(.num_statements) (\(.percent_statements_covered_display)%) · branches \(.covered_branches)/\(.num_branches) (\(.percent_branches_covered_display)%)"' \
            "$RUNNER_TEMP/coverage.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Test Observatory rendering
        run: node tests/test_observe_ui.js
      - name: Reproduce resource-allocation calculations
        run: |
          python -S scripts/analyze_resource_allocation.py --output "$RUNNER_TEMP/calculations.json"
          cmp "$RUNNER_TEMP/calculations.json" results/resource-allocation-calculations-001.json
