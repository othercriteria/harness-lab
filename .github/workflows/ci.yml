name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check prose spacing in maintained Markdown
        run: python -S scripts/check_docs_spacing.py
      - name: Rebuild the historical Worker assignment
        run: python -S examples/preparing-worker-package/prepare.py "$RUNNER_TEMP/assignment"
      - name: Test Delegate artifacts, reviewed application, checkpoint policy and Observatory
        run: |
          python -S -m unittest \
            tests/test_example_evidence.py tests/test_export_issue_context.py tests/test_delegate_artifacts.py tests/test_delegate_apply.py \
            tests/test_checkpoint_policy.py tests/test_observe.py tests/test_observe_costs.py \
            tests.test_delegate_job.DelegateJobTests.test_dispatch_records_only_explicit_classification
      - name: Test Observatory rendering
        run: node tests/test_observe_ui.js
      - name: Reproduce resource-allocation calculations
        run: |
          python -S scripts/analyze_resource_allocation.py --output "$RUNNER_TEMP/calculations.json"
          cmp "$RUNNER_TEMP/calculations.json" results/resource-allocation-calculations-001.json
